arm_${ARM_SIDE_PREFIX}_cartesian_force_controller:
  ros__parameters:
    type: tsid_controllers/CartesianForceController

    local_frame: false
    root_joint_type: JointModelFreeFlyer
    
    joint_state_names:
      - arm_teleop_${ARM_SIDE_PREFIX}_1_joint
      - arm_teleop_${ARM_SIDE_PREFIX}_2_joint
      - arm_teleop_${ARM_SIDE_PREFIX}_3_joint
      - arm_teleop_${ARM_SIDE_PREFIX}_4_joint
      - arm_teleop_${ARM_SIDE_PREFIX}_5_joint
      - arm_teleop_${ARM_SIDE_PREFIX}_6_joint
      - arm_teleop_${ARM_SIDE_PREFIX}_7_joint

    joint_command_names:
      - arm_teleop_${ARM_SIDE_PREFIX}_1_joint
      - arm_teleop_${ARM_SIDE_PREFIX}_2_joint
      - arm_teleop_${ARM_SIDE_PREFIX}_3_joint
      - arm_teleop_${ARM_SIDE_PREFIX}_4_joint
      - arm_teleop_${ARM_SIDE_PREFIX}_5_joint
      - arm_teleop_${ARM_SIDE_PREFIX}_6_joint
      - arm_teleop_${ARM_SIDE_PREFIX}_7_joint

    interface_name: position

    ee_names:
      - arm_teleop_${ARM_SIDE_PREFIX}_7_link

    velocity_scaling: 1.0

    posture_gain: 1.0

    cartesian_force_gain:
         arm_teleop_${ARM_SIDE_PREFIX}_7_link:
          kp_x: 2.0
          kp_y: 2.0
          kp_z: 2.0
          kp_roll: 1.0
          kp_pitch: 1.0
          kp_yaw: 1.0
          kd_x: 0.0
          kd_y: 0.0
          kd_z: 0.0
          kd_roll: 0.0
          kd_pitch: 0.0
          kd_yaw: 0.0

    ft_sensor:
      arm_teleop_${ARM_SIDE_PREFIX}_7_link:
        name: wrist_teleop_${ARM_SIDE_PREFIX}_ft_sensor
        filter_cutoff: 0.1

    haptic_feedback: true

    ft_sensor_slave:
      arm_teleop_${ARM_SIDE_PREFIX}_7_link:
        name: wrist_${ARM_SIDE_PREFIX}_ft_sensor
        filter_cutoff: 0.1
    
    impedance_gains:
      arm_teleop_${ARM_SIDE_PREFIX}_1_link:
        kp: 1.0
        kd: 0.0